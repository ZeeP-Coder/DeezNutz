<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Surprise</title>
    <meta
      name="description"
      content="A goofy, blue birthday envelope surprise for the coolest girl ever."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Baloo+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/landing.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="bubble bubble-one"></div>
      <div class="bubble bubble-two"></div>
      <div class="bubble bubble-three"></div>
      <div class="sparkles" aria-hidden="true"></div>
      <div class="cat cat-left" aria-hidden="true"><span>•ᴗ•</span></div>
      <div class="cat cat-right" aria-hidden="true"><span>•ᴥ•</span></div>

      <main class="hero">
        <section class="intro-copy">
          <p class="eyebrow">For the absolute best patalingoat</p>
          <h1>Happy Birthday, Kyren</h1>
          <p class="subtitle">
            A little blue surprise filled with movie nights, Scrabble chaos, and a birthday message made just for you.
          </p>
        </section>

        <section class="envelope-scene" aria-label="Birthday envelope surprise">
          <div class="envelope-card" id="envelopeCard">
            <div class="envelope-front">
              <div class="envelope-flap"></div>
              <div class="envelope-side left"></div>
              <div class="envelope-side right"></div>
              <div class="envelope-bottom"></div>
              <div class="stamp">♡</div>
              <button class="click-me" type="button" aria-label="Click to open the letter">
                Click Me
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="../scripts/landing.js"></script>
  </body>
</html>
